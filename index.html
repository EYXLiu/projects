 .grid {

@media (max-width: 700px) {

  .project {

  .tags {
    display: flex;
    flex-wrap: wrap;

  .tag { font-size: 12px; }
  .project[hidden] { display: none; }
  .display-tag {
    display: inline-block;
    padding: 7px 12px;
    border: 1px solid #d1d9e0;
    border-radius: 20px;
    background: #f6f8fa;

/*
  {
    repo: "",
    language: [],
    categories: [],
    display: []

*/

let selectedLanguages = new Set();
let selectedCategories = new Set();

const languages = [
  "All", ...new Set(projects.flatMap(p => p.language))
];
const categories = [
  "All", ...new Set(projects.flatMap(p => p.categories))
];

function makeFilters(elementId, options, selected, onSelect) {
  const container = document.getElementById(elementId);
  container.replaceChildren();

  options.forEach(option => {
    const button = document.createElement("button");
    button.textContent = option;

    button.classList.toggle(
      "active",
      selected.has(option)
    );
    button.addEventListener("click", () => {
      onSelect(option);
    });
    container.appendChild(button);
  });
}

function render() {
  makeFilters(
    "languages",
    languages.filter(l => l !== "All"),
    selectedLanguages,
    value => {
      if (selectedLanguages.has(value)) {
        selectedLanguages.delete(value);
      } else {
        selectedLanguages.add(value);
      }
      render();
    }
  );

  makeFilters(
    "categories",
    categories.filter(c => c !== "All"),
    selectedCategories,
    value => {
      if (selectedCategories.has(value)) {
        selectedCategories.delete(value);
      } else {
        selectedCategories.add(value);
      }
      render();
    }
  );

  const visible = projects.filter(p => {
    const matchesLanguage =
      selectedLanguages.size === 0 ||
      p.language.some(l => selectedLanguages.has(l));

    const matchesCategory =
      selectedCategories.size === 0 ||
      p.categories.some(c => selectedCategories.has(c));

    if (
      selectedLanguages.size > 0 &&
      selectedCategories.size > 0
    ) {
      return matchesLanguage || matchesCategory;
    }

    return matchesLanguage && matchesCategory;
  });

  document.getElementById("count").textContent =
    `${visible.length} projects`;

  const grid = document.getElementById("projects");
  grid.replaceChildren();

  visible.forEach(p => {
    const card = document.createElement("article");
    card.className = "project";

    const link = document.createElement("a");
    link.href = `https://github.com/EYXLiu/${p.repo}`;
    link.target = "_blank";
    link.rel = "noopener noreferrer";

    const image = document.createElement("img");
    image.src =
      "https://github-stats-extended.vercel.app/api/pin" +
      "?username=EYXLiu" +
      `&repo=${encodeURIComponent("EYXLiu/" + p.repo)}` +
      "&description_lines_count=1&theme=light_github_repocard";
    image.alt = `${p.repo} GitHub repository card`;
    image.loading = "lazy";

    link.appendChild(image);
    card.appendChild(link);

    const tags = document.createElement("div");
    tags.className = "tags";

    [...p.language, ...p.categories].forEach(tag => {
      const button = document.createElement("button");
      button.className = "tag";
      button.textContent = tag;

      button.addEventListener("click", () => {
        if (p.language.includes(tag)) {
            if (selectedLanguages.has(tag)) {
            selectedLanguages.delete(tag);
            } else {
            selectedLanguages.add(tag);
            }
        } else if (p.categories.includes(tag)) {
            if (selectedCategories.has(tag)) {
            selectedCategories.delete(tag);
            } else {
            selectedCategories.add(tag);
            }
        }

        render();
      });

      tags.appendChild(button);
    });

    (p.display || []).forEach(tag => {
      const span = document.createElement("span");
      span.className = "tag display-tag";
      span.textContent = tag;
      tags.appendChild(span);
    });

    card.appendChild(tags);
    grid.appendChild(card);
  });
}
